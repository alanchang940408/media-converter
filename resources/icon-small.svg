<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simplified Media Converter icon for 16–32 px: fewer, bolder shapes, almost full-bleed. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="0.5" stop-color="#7B5CFA"/>
      <stop offset="1" stop-color="#F2557F"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F5BF5"/>
      <stop offset="1" stop-color="#E23E84"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#bg)"/>

  <!-- photo card: bold outline + sun -->
  <g transform="rotate(-11 380 380)">
    <rect x="150" y="180" width="460" height="380" rx="56" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="56"/>
    <circle cx="470" cy="300" r="56" fill="#FFD66B"/>
  </g>

  <!-- video card -->
  <rect x="380" y="440" width="560" height="440" rx="84" fill="#FFFFFF"/>
  <path d="M590 545 L590 775 L780 660 Z" fill="url(#play)" stroke="url(#play)" stroke-width="48" stroke-linejoin="round"/>
</svg>
