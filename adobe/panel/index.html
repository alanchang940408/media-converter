<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Converter</title>
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <span class="title">Media Converter</span>
        <span id="hostBadge" class="badge"></span>
      </header>

      <section id="noInfo" class="no-info" hidden>
        <p id="noInfoText" class="strong"></p>
        <p id="noInfoHint" class="muted small"></p>
        <button id="retryBtn" type="button" data-i18n="retry"></button>
      </section>

      <main id="main" hidden>
        <div id="scroll" class="scroll">
          <fieldset id="settings" class="plain">
            <section class="block">
              <div class="label-row">
                <span class="label" data-i18n="source"></span>
                <button id="refreshBtn" type="button" class="link" data-i18n="refresh"></button>
              </div>
              <div id="sourceText" class="box"></div>
              <div id="aeNote" class="muted small" data-i18n="aeBgNote" hidden></div>
              <div id="aeWarn" class="warn-text small" data-i18n="aeUnsaved" hidden></div>
              <div id="rangeRow" class="row" hidden>
                <label class="row-label" for="rangeSel" data-i18n="range"></label>
                <select id="rangeSel" class="grow" data-i18n-title="rangeTitle">
                  <option value="entire" data-i18n="rangeEntire"></option>
                  <option value="inout" data-i18n="rangeInOut"></option>
                </select>
              </div>
            </section>

            <section class="block">
              <div class="label-row">
                <span class="label" data-i18n="outputs"></span>
              </div>
              <div id="outputList" class="outputs"></div>
              <div id="noPresets" class="box warn" data-i18n="noPresets" hidden></div>
              <button id="addOutputBtn" type="button" class="add-btn" data-i18n="addOutput"></button>
              <div id="planNote" class="plan-note small" hidden></div>
            </section>

            <section class="block">
              <div class="label-row">
                <label class="label" for="outMode" data-i18n="output"></label>
              </div>
              <select id="outMode" class="full">
                <option value="project" data-i18n="outProject"></option>
                <option value="app" data-i18n="outApp"></option>
                <option value="custom" data-i18n="outCustom"></option>
              </select>
              <div class="row">
                <span id="outPath" class="path ellipsis grow small"></span>
                <button id="browseBtn" type="button" class="small-btn" data-i18n="browse"></button>
              </div>
            </section>
          </fieldset>
        </div>

        <div class="footer">
          <button id="goBtn" type="button" class="primary"></button>
          <div id="progress" class="progress" hidden>
            <div class="progress-head">
              <span id="progressLabel" class="ellipsis grow"></span>
              <button id="cancelBtn" type="button" class="small-btn" data-i18n="cancel"></button>
            </div>
            <div id="progressBarBox" class="bar"><div id="progressBar" class="bar-fill"></div></div>
            <div id="progressText" class="progress-text muted small"></div>
          </div>
          <div id="log" class="log" aria-live="polite"></div>
        </div>
      </main>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/cep.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
